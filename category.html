  <script>
  (async function () {
    if (!checkConfig()) return;
    await initPage('cat');
    const params = new URLSearchParams(location.search);
    let cat = params.get('cat') || '';
    let page = 1;
    const SIZE = 12;

    function catIds(slug) {
      let target = null;
      for (const c of Object.values(CAT_MAP || {})) if (c.slug === slug) target = c;
      if (!target) return [];
      const ids = [target.id];
      (function walk(c) { (c.children || []).forEach(s => { ids.push(s.id); walk(s); }); })(target);
      return ids;
    }

    async function load() {
      document.getElementById('postGrid').innerHTML = '<div class="ning-loading">加载中…</div>';
      const filters = ['status=eq.published', 'private=eq.false'];
      let title = '全部文章';
      if (cat) {
        const ids = catIds(cat);
        if (ids.length) {
          filters.push('category_id=in.(' + ids.join(',') + ')');
          title = CAT_MAP[ids[0]].name;
        }
      }
      try {
        const items = await Supa.select('posts', {
          select: 'id,title,description,cover,category_id,pinned,views,created_at',
          filters: filters, order: 'pinned.desc,created_at.desc', limit: SIZE, offset: (page - 1) * SIZE,
        });
        const total = await Supa.countRows('posts', filters);
        document.title = title + ' · 寜的小站';
        document.getElementById('pageTitle').textContent = title;
        document.getElementById('pageSub').textContent = '共 ' + total + ' 篇';
        document.getElementById('postGrid').innerHTML = items.length ? items.map(function (p) {
          return '<a class="ning-card" href="/post.html?id=' + p.id + '">' +
            (p.cover ? '<img class="nc-cover" src="' + escapeHtml(p.cover) + '" alt="" loading="lazy">' : '<div class="nc-cover-ph">寜</div>') +
            '<div class="nc-body">' +
            '<div class="nc-title">' + (p.pinned ? '<span class="ning-badge ning-badge--pin">置顶</span>' : '') + escapeHtml(p.title) + '</div>' +
            '<div class="nc-desc">' + escapeHtml(p.description || '暂无简介') + '</div>' +
            '<div class="nc-meta"><span>' + catName(p.category_id) + '</span><span>' + fmtDate(p.created_at) + '</span><span>' + (p.views || 0) + ' 次阅读</span></div>' +
            '</div></a>';
        }).join('') : '<div class="ning-empty" style="grid-column:1/-1"><div class="e-icon">📭</div>这个分类下还没有文章</div>';

        const totalPage = Math.max(1, Math.ceil(total / SIZE));
        let html = '<button ' + (page <= 1 ? 'disabled' : '') + ' data-p="' + (page - 1) + '">‹</button>';
        for (let i = 1; i <= totalPage && i <= 9; i++) html += '<button class="' + (i === page ? 'cur' : '') + '" data-p="' + i + '">' + i + '</button>';
        if (totalPage > 9) html += '<span class="pinfo">… ' + totalPage + ' 页</span>';
        html += '<button ' + (page >= totalPage ? 'disabled' : '') + ' data-p="' + (page + 1) + '">›</button>';
        document.getElementById('pager').innerHTML = totalPage > 1 ? html : '';
        document.querySelectorAll('#pager button').forEach(function (b) {
          b.addEventListener('click', function () { page = +b.dataset.p; load(); scrollTo(0, 0); });
        });
      } catch (e) {
        document.getElementById('postGrid').innerHTML = '<div class="ning-empty" style="grid-column:1/-1">加载失败：' + escapeHtml(e.message) + '</div>';
      }
    }
    load();
  })();
  </script>
