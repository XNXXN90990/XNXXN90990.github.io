<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'%3E%3Crect width='44' height='44' rx='11' fill='%234051b5'/%3E%3Ctext x='22' y='30' font-size='22' fill='white' text-anchor='middle' font-weight='700'%3E寜%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/main.css">
  <script src="/vendor/disable-devtool.min.js"></script>
  <script src="/vendor/marked.min.js"></script>
</head>
<body>
  <main class="container" id="app">
    <div id="content" style="max-width: 1080px; margin: 0 auto;"><div class="loading">加载中…</div></div>
  </main>

  <script src="/config.js"></script>
  <script src="/js/supa.js"></script>
  <script src="/js/common.js"></script>
  <script>
  (async function () {
    if (!checkConfig()) return;
    await initShell('post');
    const id = new URLSearchParams(location.search).get('id');
    if (!id) { $('#content').innerHTML = '<div class="empty">缺少文章 ID</div>'; return; }
    function render(p) {
      document.title = p.title;
      const cat = CAT_MAP ? CAT_MAP[p.category_id] : null;
      const tags = String(p.tags || '').split(/[,，]/).filter(Boolean);
      $('#content').innerHTML = `
        <article class="article">
          <div class="article-head">
            <h1>${p.pinned ? '<span class="pin">置顶</span> ' : ''}${p.private ? '<span class="lock-badge">私密</span> ' : ''}${escapeHtml(p.title)}</h1>
            <div class="meta">
              ${cat ? `<a href="/category.html?cat=${cat.slug}">${escapeHtml(cat.name)}</a>` : ''}
              <span>发布于 ${fmtDate(p.created_at)}</span>
              ${p.updated_at && fmtDate(p.updated_at) !== fmtDate(p.created_at) ? `<span>更新于 ${fmtDate(p.updated_at)}</span>` : ''}
              <span>${p.views || 0} 次阅读</span>
            </div>
            ${tags.length ? `<div class="chips">${tags.map(t => `<span class="tag-chip">${escapeHtml(t.trim())}</span>`).join('')}</div>` : ''}
          </div>
          <div class="md" id="mdBody"></div>
        </article>
        <div style="margin-top: 20px; text-align: center;">
          <a class="btn ghost" href="${cat ? '/category.html?cat=' + cat.slug : '/category.html'}">← 返回${cat ? '「' + cat.name + '」' : '文章列表'}</a>
        </div>`;
      $('#mdBody').innerHTML = renderMd(p.content);
    }
    function showLock() {
      $('#content').innerHTML = `
        <div class="lock-panel">
          <div class="lock-icon">🔒</div>
          <h2>这是私密文章</h2>
          <p>请在私人空间输入访问码解锁后阅读</p>
          <a class="btn" href="/private.html">前往私人空间</a>
        </div>`;
    }
    try {
      // 匿名请求：RLS 只放行已发布非私密文章
      const rows = await Supa.select('posts', { select: '*', filters: [`id=eq.${id}`, 'status=eq.published'] });
      if (rows.length) {
        const p = rows[0];
        render(p);
        Supa.rpc('increment_post_view', { p_id: +id }).catch(() => {});
      } else {
        // 可能是私密文章：用本机保存的访问码尝试解锁
        const code = getPrivateCode();
        if (code) {
          const priv = await Supa.rpc('get_private_post', { p_code: code, p_id: +id }).catch(() => null);
          const row = Array.isArray(priv) ? priv[0] : priv;
          if (row && row.id) { render(row); return; }
        }
        showLock();
      }
    } catch (e) {
      $('#content').innerHTML = `<div class="empty"><div class="e-icon">📄</div>${escapeHtml(e.message)}</div>`;
    }
  })();
  </script>
</body>
</html>
