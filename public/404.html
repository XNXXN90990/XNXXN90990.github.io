<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>寜的小站 · Ning's Blog</title>
    <script>
      // GitHub Pages SPA 回退：深链接（如 /posts/xxx）在这里转成 /?/posts/xxx，
      // index.html 再还原回原地址交给 vue-router 处理。
      (function (l) {
        if (l.search.indexOf('?/') >= 0) return;
        var target = l.pathname + l.search + l.hash;
        try {
          sessionStorage.setItem('ning-gh-redirect', target);
        } catch (e) {
          /* ignore */
        }
        l.replace('/?' + target);
      })(window.location);
    </script>
  </head>
  <body></body>
</html>
