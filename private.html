  <script>
  (async function () {
    if (!checkConfig()) return;
    await initPage('private');
    const content = document.getElementById('privateContent');

    function showLock(msg) {
      content.innerHTML =
        '<div class="ning-lock-panel"><div class="lp-icon">🔒</div><h2>私人空间</h2>' +
        '<p>' + (msg || '这里只属于寜自己。<br>输入访问码，仅在本设备保存。') + '</p>' +
        '<input type="password" id="codeInput" placeholder="请输入访问码" autocomplete="off">' +
        '<div style="margin-top:1rem;"><button class="md-button md-button--primary" id="unlockBtn" style="width:100%;">解锁</button></div></div>';
      document.getElementById('unlockBtn').addEventListener('click', unlock);
      document.getElementById('codeInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') unlock(); });
      document.getElementById('codeInput').focus();
    }

    async function unlock() {
      const code = document.getElementById('codeInput').value.trim();
      if (!code) return;
      const btn = document.getElementById('unlockBtn');
      btn.disabled = true; btn.textContent = '验证中…';
      try {
        const ok = await Supa.rpc('verify_private_code', { p_code: code });
        if (ok === true || ok === 'true' || ok === 1 || ok === '1' || (ok && ok.ok)) {
          localStorage.setItem('private_code', code);
          toast('解锁成功，欢迎回来 👋');
          loadPrivate(code);
        } else throw new Error('wrong');
      } catch (e) {
        btn.disabled = false; btn.textContent = '解锁';
        toast('访问码错误', true);
      }
    }

    async function loadPrivate(code) {
      try {
        const rows = await Supa.rpc('get_private_posts', { p_code: code });
        const privates = Array.isArray(rows) ? rows : [];
        content.innerHTML =
          '<div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:.2em;">' +
          '<h1 style="margin:0;">私人空间 🔐</h1>' +
          '<a class="md-button" id="relockBtn" style="margin-left:auto;">锁定本设备</a></div>' +
          '<p class="ning-page-sub">共 ' + privates.length + ' 篇私密文章 · 仅本设备可见</p>' +
          (privates.length ? '<div class="ning-cards">' + privates.map(p =>
            '<a class="ning-card" href="/post.html?id=' + p.id + '">' +
            (p.cover ? '<img class="nc-cover" src="' + escapeHtml(p.cover) + '" alt="" loading="lazy">' : '<div class="nc-cover-ph">寜</div>') +
            '<div class="nc-body"><div class="nc-title"><span class="ning-badge ning-badge--lock">私密</span>' + escapeHtml(p.title) + '</div>' +
            '<div class="nc-desc">' + escapeHtml(p.description || '暂无简介') + '</div>' +
            '<div class="nc-meta"><span>' + catName(p.category_id) + '</span><span>' + fmtDate(p.created_at) + '</span></div>' +
            '</div></a>').join('') + '</div>'
          : '<div class="ning-empty"><div class="e-icon">🗝</div>还没有私密文章，可在管理端发布时勾选「私密」</div>');
        document.getElementById('relockBtn').addEventListener('click', function () {
          localStorage.removeItem('private_code');
          toast('已锁定');
          showLock('已在本设备锁定。重新输入访问码即可解锁。');
        });
      } catch (e) {
        toast('加载失败：' + e.message, true);
      }
    }

    var saved = getPrivateCode();
    if (saved) loadPrivate(saved);
    else showLock();
  })();
  </script>
