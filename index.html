<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="寜的小站 · Ning's Blog —— 宁静致远，记录学习、生活与思考。密码学与 AI 系列文章 / 教程 / 杂想 / 说说。" />
    <meta name="theme-color" content="#050a06" />
    <title>寜的小站 · Ning's Blog</title>
    <!-- 分享卡片（微信 / QQ / Twitter 等平台抓取） -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="寜的小站 · Ning's Blog" />
    <meta property="og:title" content="寜的小站 · Ning's Blog" />
    <meta property="og:description" content="宁静致远，记录学习、生活与思考。密码学与 AI 系列文章 / 教程 / 杂想 / 说说。" />
    <meta property="og:url" content="https://xnxxn90990.github.io/" />
    <meta property="og:image" content="https://xnxxn90990.github.io/og-card.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="寜的小站 · Ning's Blog" />
    <meta name="twitter:description" content="宁静致远，记录学习、生活与思考。" />
    <meta name="twitter:image" content="https://xnxxn90990.github.io/og-card.png" />
    <!-- RSS 订阅自动发现 -->
    <link rel="alternate" type="application/rss+xml" title="寜的小站 · Ning's Blog" href="https://xnxxn90990.github.io/feed.xml" />
    <!-- 书法字体（马善政毛笔楷书，OFL 开源）：水印与点缀用，加载失败回退系统楷体 -->
    <link rel="preconnect" href="https://fonts.loli.net" />
    <link rel="preconnect" href="https://gstatic.loli.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.loli.net/css2?family=Ma+Shan+Zheng&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <script>
      // 主题：在 Vue 挂载前设置好，避免刷新时闪错色（与 src/utils/theme.js 逻辑一致）
      (function () {
        try {
          var t = localStorage.getItem('ning-theme');
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.dataset.theme = t;
          // 主题色（accent）
          var a = localStorage.getItem('ning-accent');
          if (['green', 'blue', 'purple', 'orange', 'pink', 'red'].indexOf(a) === -1) a = 'purple';
          document.documentElement.dataset.accent = a;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.dataset.accent = 'purple';
        }
      })();
      // GitHub Pages SPA 回退：直接访问 /posts/xxx 等深链时由 404.html 转到 /?/posts/xxx，再在这里还原地址
      (function (l) {
        if (l.search.indexOf('?/') === 0) {
          var redirect = sessionStorage.getItem('ning-gh-redirect');
          if (redirect) {
            sessionStorage.removeItem('ning-gh-redirect');
            history.replaceState(null, '', redirect);
          }
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
