<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="寜的小站 · Ning's Blog —— 宁静致远，记录学习、生活与思考。教程 / 学习路线 / 随笔 / 杂谈。" />
    <meta name="theme-color" content="#050a06" />
    <title>寜的小站 · Ning's Blog</title>
    <script>
      // 主题：在 Vue 挂载前设置好，避免刷新时闪错色（与 src/utils/theme.js 逻辑一致）
      (function () {
        try {
          var t = localStorage.getItem('ning-theme');
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
      // GitHub Pages SPA 回退：直接访问 /posts/xxx 等深链时由 404.html 转到 /?/posts/xxx，再在这里还原地址
      (function (l) {
        if (l.search.indexOf('?/') === 0) {
          var redirect = sessionStorage.getItem('ning-gh-redirect');
          if (redirect) {
            sessionStorage.removeItem('ning-gh-redirect');
            history.replaceState(null, '', redirect);
          }
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
